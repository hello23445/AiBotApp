<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram WebApp</title>
  <!-- Подключаем скрипт Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Адаптируем цвета под тему Telegram пользователя */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Блок состояния (загрузка/ошибка) */
    #status-message {
      margin-top: 50px;
      text-align: center;
      font-size: 16px;
      color: var(--tg-theme-hint-color, #999999);
    }
    .error-text {
      color: var(--tg-theme-destructive-text-color, #ff3b30) !important;
    }

    /* Основной контейнер с результатом */
    #content-container {
      display: none; /* Скрыт до получения успешного ответа */
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      gap: 15px;
    }

    .response-heading {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    /* Стили для кода */
    pre {
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid var(--tg-theme-hint-color, #cccccc);
    }

    /* Кнопка копирования (стилизована под нативные кнопки Telegram) */
    button {
      background-color: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }

    /* Иконки внутри кнопки */
    svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div id="status-message">Загрузка данных...</div>

  <div id="content-container">
    <h1 class="response-heading">Полученный ответ</h1>
    <pre><code id="response-code"></code></pre>
    <button id="copy-btn">
      <span id="btn-icon">
        <!-- Иконка "Скопировать" по умолчанию -->
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </span>
      <span id="btn-text">Скопировать</span>
    </button>
  </div>

  <script>
    // 1. Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Разворачиваем окно на всю высоту

    // DOM Элементы
    const statusMessage = document.getElementById('status-message');
    const contentContainer = document.getElementById('content-container');
    const responseCodeElement = document.getElementById('response-code');
    const copyBtn = document.getElementById('copy-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');

    // SVG иконки
    const copyIconSvg = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
    const checkIconSvg = '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>';

    // 2. Получение параметра startapp
    // В WebApp параметр ?startapp= передается в поле initDataUnsafe.start_param
    const startCode = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('startapp');

    if (!startCode) {
      showError("Код не найден. Запустите приложение через бота с параметром startapp.");
    } else {
      fetchDataFromGAS(startCode);
    }

    // 3. Функция отправки запроса в Google Apps Script
    function fetchDataFromGAS(code) {
      const webAppUrl = "https://script.google.com/macros/s/AKfycbxZJBeU7njCZd_hdpcGrO1Vsr8YbiflF03Bci5XAvmWzfMqIpjFQrEjZHzIIsHXTJNY/exec";

      fetch(webAppUrl, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8", 
        },
        body: JSON.stringify({
          action: "get_response",
          code: code
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          // Успешно: скрываем статус, показываем блок с ответом
          statusMessage.style.display = 'none';
          responseCodeElement.textContent = formatResponse(data.response);
          contentContainer.style.display = 'flex';
        } else {
          showError("Ошибка от сервера: " + (data.message || "Неизвестная ошибка"));
        }
      })
      .catch(error => {
        showError("Ошибка при получении данных: " + error.message);
      });
    }

    // Функция вывода ошибки на экран
    function showError(text) {
      statusMessage.textContent = text;
      statusMessage.classList.add('error-text');
    }

    // Приводим JSON и Python-подобную строку словаря к единому читаемому виду.
    function formatResponse(response) {
      if (response && typeof response === 'object') {
        return JSON.stringify(response, null, 2);
      }

      const responseText = String(response ?? '').trim();

      try {
        return JSON.stringify(JSON.parse(responseText), null, 2);
      } catch (error) {
        try {
          return JSON.stringify(JSON.parse(convertSingleQuotedJson(responseText)), null, 2);
        } catch (conversionError) {
          return responseText;
        }
      }
    }

    function convertSingleQuotedJson(text) {
      let result = '';
      let insideString = false;
      let quote = '';

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const previousCharacter = text[index - 1];
        const nextCharacter = text[index + 1];

        if (!insideString && (character === '"' || character === "'")) {
          insideString = true;
          quote = character;
          result += '"';
          continue;
        }

        if (insideString && character === quote && previousCharacter !== '\\'
          && (quote !== "'" || !nextCharacter || /[\s,:\]}]/.test(nextCharacter))) {
          insideString = false;
          quote = '';
          result += '"';
          continue;
        }

        if (insideString && quote === "'" && character === '"' && previousCharacter !== '\\') {
          result += '\\"';
          continue;
        }

        if (insideString && quote === "'" && character === '\\' && text[index + 1] === "'") {
          result += "'";
          index += 1;
          continue;
        }

        result += character;
      }

      return result;
    }

    // 4. Логика кнопки "Скопировать"
    copyBtn.addEventListener('click', () => {
      const textToCopy = responseCodeElement.textContent;

      // Используем современный Clipboard API с фоллбеком для старых браузеров
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(showSuccessState);
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showSuccessState();
        } catch (err) {
          console.error('Ошибка копирования', err);
        }
        document.body.removeChild(textArea);
      }
    });

    // Функция изменения кнопки на 3 секунды
    function showSuccessState() {
      // Меняем текст и иконку на "Скопировано!"
      btnText.textContent = "Скопировано!";
      btnIcon.innerHTML = checkIconSvg;
      
      // Даем тактильный отклик через Telegram API (легкая вибрация)
      tg.HapticFeedback.notificationOccurred('success');

      // Возвращаем обратно через 3 секунды
      setTimeout(() => {
        btnText.textContent = "Скопировать";
        btnIcon.innerHTML = copyIconSvg;
      }, 3000);
    }
  </script>
</body>
</html>
